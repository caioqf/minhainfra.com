<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>semluz · quanto tempo o Brasil fica sem energia</title>
    <meta name="description" content="Mapa e histórico das interrupções de energia elétrica no Brasil, município por município, com dados abertos da ANEEL." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M13 2 4 14h7l-1 8 9-12h-7z' fill='%23E8A317'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet" />
    <script>
      try { const t = localStorage.getItem('semluz-tema'); if (t) document.documentElement.dataset.theme = t } catch {}
    </script>
  </head>
  <body>
    <div id="app" class="hud carregando">
      <header class="topo">
        <a class="logo" href="./" aria-label="semluz, início">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" /></svg>
          <span>semluz</span>
        </a>
        <nav class="seg" id="camada" aria-label="O que o mapa mostra">
          <button data-c="horas" class="on">Horas<span class="longo"> sem luz</span></button>
          <button data-c="limite">Limite<span class="longo"> ANEEL</span></button>
        </nav>
        <nav class="seg" id="janela" aria-label="Período">
          <button data-j="12" class="on">12 meses</button>
          <button data-j="1">Mês</button>
        </nav>
        <div class="topo-dir">
          <button class="ico" id="btn-busca" aria-label="Buscar município (Ctrl+K)">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          </button>
          <button class="pill" id="btn-metodo">Como medimos</button>
          <button class="ico" id="btn-tema" aria-label="Alternar tema">
            <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
          </button>
        </div>
      </header>

      <section class="hero card" id="hero" aria-live="polite"></section>

      <aside class="painel esq card" id="painel-esq"></aside>

      <main class="palco card" id="palco">
        <div class="trilha" id="trilha"></div>
        <canvas id="mapa" aria-label="Mapa do Brasil por horas sem energia"></canvas>
        <div class="chips" id="chips"></div>
        <div class="tip" id="tip" role="tooltip"></div>
        <div class="legenda" id="legenda"></div>
        <div class="zoom">
          <button id="zoom-mais" aria-label="Aproximar">+</button>
          <button id="zoom-menos" aria-label="Afastar">−</button>
        </div>
        <div class="tempo" id="tempo">
          <button class="play" id="play" aria-label="Reproduzir linha do tempo">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          </button>
          <div class="tempo-rotulo" id="tempo-rotulo"></div>
          <div class="regua">
            <input type="range" id="slider" min="0" max="0" value="0" aria-label="Mês" />
            <div class="anos" id="anos"></div>
          </div>
          <button class="ultimo" id="btn-ultimo"><i></i>Último mês</button>
        </div>
      </main>

      <aside class="painel dir card" id="painel-dir"></aside>

      <footer class="rodape">
        <span id="atualizado"></span>
        <a href="https://dadosabertos.aneel.gov.br/dataset/interrupcoes-de-energia-eletrica-nas-redes-de-distribuicao" target="_blank" rel="noopener">Dados da ANEEL</a>
      </footer>
    </div>

    <div class="busca" id="busca" hidden>
      <div class="busca-caixa" role="dialog" aria-label="Buscar município">
        <div class="busca-campo">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="busca-input" placeholder="Busque sua cidade" autocomplete="off" spellcheck="false" />
          <kbd>Esc</kbd>
        </div>
        <ul id="busca-lista" role="listbox"></ul>
        <div class="busca-dica"><kbd>↑</kbd><kbd>↓</kbd> navegar <kbd>↵</kbd> abrir <kbd>Esc</kbd> fechar</div>
      </div>
    </div>

    <div class="metodo" id="metodo" hidden>
      <div class="metodo-caixa" role="dialog" aria-label="Como medimos">
        <button class="fechar" id="metodo-fechar" aria-label="Fechar">×</button>
        <div id="metodo-corpo"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
