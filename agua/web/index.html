<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>minhainfra · água: quanto tempo falta água na sua cidade</title>
    <meta name="description" content="Mapa e histórico da falta de água no abastecimento, município por município, com dados públicos do SNIS e do SINISA." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5S5 10.2 5 14.5a7 7 0 0 0 14 0C19 10.2 12 2.5 12 2.5z' fill='%232F8FC4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet" />
    <script>
      try { const t = localStorage.getItem('minhainfra-tema'); if (t) document.documentElement.dataset.theme = t } catch {}
    </script>
    <!-- carrega a próxima seção quando o mouse para sobre a aba, para a troca ser instantânea -->
    <script type="speculationrules">{"prerender": [{"where": {"selector_matches": ".secoes a, a.card"}, "eagerness": "moderate"}]}</script>
  </head>
  <body>
    <div id="app" class="hud carregando">
      <header class="topo">
        <a class="logo" href="../" aria-label="minhainfra, início"><span>minhainfra</span></a>
        <nav class="secoes" id="secoes" aria-label="Seções"></nav>
        <nav class="seg" id="camada" aria-label="O que o mapa mostra">
          <button data-c="horas" class="on">Horas<span class="longo"> sem água</span></button>
          <button data-c="vezes">Vezes<span class="longo"> sem água</span></button>
          <button data-c="rodizio">Rodízio</button>
        </nav>
        <div class="topo-dir">
          <button class="ico" id="btn-busca" aria-label="Buscar município (Ctrl+K)">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          </button>
          <button class="pill compart" id="btn-compartilhar" aria-label="Compartilhar">
            <svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" /></svg><span class="longo">Compartilhar</span>
          </button>
          <button class="pill" id="btn-metodo">Como medimos</button>
          <button class="ico" id="btn-tema" aria-label="Alternar tema">
            <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
          </button>
        </div>
      </header>

      <section class="hero card" id="hero" aria-live="polite"></section>

      <aside class="painel esq card" id="painel-esq"></aside>

      <main class="palco card" id="palco">
        <div class="trilha" id="trilha"></div>
        <canvas id="mapa" aria-label="Mapa do Brasil por horas sem água"></canvas>
        <div class="chips" id="chips"></div>
        <div class="tip" id="tip" role="tooltip"></div>
        <div class="legenda" id="legenda"></div>
        <div class="zoom">
          <button id="zoom-mais" aria-label="Aproximar">+</button>
          <button id="zoom-menos" aria-label="Afastar">−</button>
        </div>
        <div class="tempo" id="tempo">
          <button class="play" id="play" aria-label="Reproduzir linha do tempo">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          </button>
          <div class="tempo-rotulo" id="tempo-rotulo"></div>
          <div class="regua">
            <input type="range" id="slider" min="0" max="0" value="0" aria-label="Ano" />
            <div class="anos" id="anos"></div>
          </div>
          <button class="ultimo" id="btn-ultimo"><i></i>Último ano</button>
        </div>
      </main>

      <aside class="painel dir card" id="painel-dir"></aside>

      <footer class="rodape">
        <span id="atualizado"></span>
        <a href="https://www.gov.br/cidades/pt-br/acesso-a-informacao/acoes-e-programas/saneamento/sinisa" target="_blank" rel="noopener">Dados do SNIS e SINISA</a>
      </footer>
    </div>

    <div class="busca" id="busca" hidden>
      <div class="busca-caixa" role="dialog" aria-label="Buscar município">
        <div class="busca-campo">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="busca-input" placeholder="Busque sua cidade" autocomplete="off" spellcheck="false" />
          <kbd>Esc</kbd>
        </div>
        <ul id="busca-lista" role="listbox"></ul>
        <div class="busca-dica"><kbd>↑</kbd><kbd>↓</kbd> navegar <kbd>↵</kbd> abrir <kbd>Esc</kbd> fechar</div>
      </div>
    </div>

    <div class="metodo" id="metodo" hidden>
      <div class="metodo-caixa" role="dialog" aria-label="Como medimos">
        <button class="fechar" id="metodo-fechar" aria-label="Fechar">×</button>
        <div id="metodo-corpo"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
